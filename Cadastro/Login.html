<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login Básico</title>
    <style>
    
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }


        .caixa-login {
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
            width: 300px;
        }


        .campo {
            margin-bottom: 15px;
        }

        .campo label {
            display: block;
            margin-bottom: 5px;
        }

        .campo input {
            width: 93%;
            padding: 8px;
        }


        button, .btn-cadastro {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            cursor: pointer;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
        }

        .btn-cadastro {
            background-color: #28a745;
            color: white;
            border: none;
            text-align: center;
            display: block;
            text-decoration: none;
            box-sizing: border-box;
            font-size: 13px;
        }
    </style>
</head>
<body>

    <div class="caixa-login">
        <h2>Entrar</h2>
        
        <form>
    
            <div class="campo">
                <label>Usuário:</label>
                <input type="text" required>
            </div>
            
        
            <div class="campo">
                <label>Senha:</label>
                <input type="password" required>
            </div>
            

            <button type="submit">Confirmar</button>
        </form>

        <hr style="margin: 15px 0; border: 0; border-top: 1px solid #ccc;">

        <a href="cadastrar.html" class="btn-cadastro">Cadastre-se</a>
    </div>

</body>
</html>
