<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
    <style>
        body{
            background-color: aliceblue;
            font-family: Arial;
        }
        .janela{
            width: 350px;
            background-color: white;
            margin: 50px auto;
            border: 1px solid black;
            padding: 20px;
        }
        label{
            display: block;
            margin-top: 10px;
        }
        input{
            width: 100%;
            box-sizing: border-box;
        }
        .botoes{
            margin-top: 15px;
            text-align: center;
        }
    </style>
</head>
<body>
    <main>
        <div class="janela">
            <h2>Cadastro de Usuário</h2>

            <label>Nome:
                <input type="text">
            </label>

            <label>Usuário:
                <input type="text">
            </label>

            <label>Senha:
                <input type="password">
            </label>

            <label>Confirmar Senha:
                <input type="password">
            </label>

            <label>Telefone:
                <input type="text">
            </label>

            <div class="botoes">
                <button type="submit">CADASTRAR</button>
            </div>
        </div>
    </main>
</body>
</html>
